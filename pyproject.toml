[project]
name = "dora-openarm-mouse-teleop"
version = "0.1.0"
description = "dora-rs node to teleoperate OpenArm end-effectors with a mouse and keyboard (Dear PyGui)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "yt1970"}]
requires-python = "==3.12.*"
dependencies = [
    "dora-rs >= 0.5.0",
    "dearpygui >= 1.11",
    "numpy",
    "pyarrow",
]

[project.urls]
Repository = "https://github.com/yt1970/dora-openarm-mouse-teleop"

[project.scripts]
dora-openarm-mouse-teleop = "dora_openarm_mouse_teleop.main:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
